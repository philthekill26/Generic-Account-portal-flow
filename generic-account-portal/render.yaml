# Free simulation service. For persistent test activity add a paid disk manually.
services:
  - type: web
    name: generic-account-portal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: FS_MODE
        value: simulation
      - key: BRAND_NAME
        value: YourBrand
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /data
